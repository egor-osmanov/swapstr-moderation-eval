name: eval

on:
  push:
  pull_request:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Rescore the keyword filter
        run: python -m src.run_keyword_eval
      - name: Rescore Claude from saved replies
        run: |
          python -m src.run_claude_eval
          python -m src.run_claude_eval prompts/classifier_v2.md
      - name: Fail if clear-set floors drop
        run: python -m src.check_regression
